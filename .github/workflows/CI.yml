name: CI

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
          # Temurin has no JDK 17 build for Windows on ARM64, and Robolectric's native SQLite
          # libraries have no windows-aarch64 build (UnsatisfiedLinkError in CacheManagerTest).
          # Use the x64 JDK, which windows-11-arm runs under x64 emulation. That also keeps the
          # floating-point results of Math.* the same as on x64 (TileSystemWebMercatorTest).
        architecture: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'x64' || '' }}
        cache: gradle
      # malinskiy/action-android/install-sdk only supports Linux and macOS ("Unsupported OS" on Windows)
    - uses: malinskiy/action-android/install-sdk@release/0.1.6
      if: runner.os != 'Windows'
      env:
        ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      # The legacy 'tools' package (the action's default) no longer exists for current cmdline-tools;
      # install only platform-tools and let the Android Gradle plugin fetch the platform and build-tools
    - uses: android-actions/setup-android@v3
      if: runner.os == 'Windows'
      with:
        packages: 'platform-tools'
      # Robolectric downloads its android-all jars from Maven Central while the tests run
      # (MavenArtifactFetcher). A dropped connection there (SocketException) fails a test even
      # though nothing is wrong with the code. Run the full build again once: the jars that did
      # download are cached in ~/.m2, so the second run completes the fetch. All tests still run.
    - run: ./gradlew build || ./gradlew build
      shell: bash
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
