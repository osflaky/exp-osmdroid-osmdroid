name: CI

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: gradle
    - uses: malinskiy/action-android/install-sdk@release/0.1.6
      env:
        ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    - name: Run the x86_64-only Android build tools (aapt2) under emulation
      if: runner.arch == 'ARM64'
      run: |
        sudo dpkg --add-architecture amd64
        sudo sed -i '/^Architectures:/d; /^Types:/a Architectures: arm64' /etc/apt/sources.list.d/ubuntu.sources
        for s in noble noble-updates noble-security; do
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu $s main" | sudo tee -a /etc/apt/sources.list.d/amd64.list
        done
        sudo apt-get update
        sudo apt-get install -y qemu-user-static binfmt-support libc6:amd64 libstdc++6:amd64 zlib1g:amd64
    - run: ./gradlew build
    timeout-minutes: 150
